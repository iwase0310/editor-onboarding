<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>アクセス申請 | 新規エディター オンボーディング</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--bg:#f6f8fb;--brand:#6457e8;--brand2:#8d7df5;--danger:#a43b3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}body:before{content:"";position:absolute;inset:-30% -20% auto auto;width:75vw;height:150vh;transform:rotate(27deg);background:linear-gradient(130deg,transparent 0 37%,rgba(101,87,232,.12) 38% 47%,transparent 48% 55%,rgba(141,125,245,.12) 56% 66%,transparent 67%);z-index:-1}.box{width:min(100%,470px);background:#fff;border-radius:24px;padding:34px;box-shadow:0 18px 50px rgba(25,31,56,.12)}.eyebrow{color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.08em}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:18px}.box h1{font-size:28px;line-height:1.3;margin:7px 0 12px}.lead{color:var(--muted);margin:0 0 22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px;font:inherit;cursor:pointer}.tabs button.active{background:#ebe9ff;color:#5549cd;border-color:#cbc5ff;font-weight:700}.panel{display:none}.panel.active{display:block}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;border:1px solid #d6dae4;border-radius:10px;padding:12px 13px;font:inherit}input:focus{outline:3px solid #ebe9ff;border-color:var(--brand)}.submit{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px;background:var(--brand);color:#fff;font:inherit;font-weight:800;cursor:pointer}.message{margin-top:16px;padding:12px;border-radius:10px;background:#f2f4f8;color:var(--muted);font-size:13px}.message.ok{background:#edfaf4;color:#176a4a}.message.error{background:#fff2f2;color:var(--danger)}.small{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}.back{display:inline-block;margin-top:18px;color:var(--brand);font-size:13px}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">E</div><div class="eyebrow">EDITOR ONBOARDING</div>
    <h1>Googleログイン</h1><p class="lead">Googleアカウントでログインしてください。</p>
    <section class="panel active" id="login"><button class="submit" id="googleLogin" type="button">Googleでログイン</button><button class="submit" id="requestAccess" type="button" hidden>このGoogleアカウントでアクセス申請する</button></section>
    <div class="message" id="message" hidden></div>
    <p class="small">@shibuya-ad.com / @axis-company.jp のアカウントは自動承認されます<br>その他のドメインは管理者の承認が必要です</p>
  </main>
  <script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const AUTO_APPROVED_DOMAINS=['axis-company.jp','shibuya-ad.com'];const isAutoApproved=email=>{const normalized=(email||'').trim().toLowerCase();return AUTO_APPROVED_DOMAINS.some(domain=>normalized.endsWith('@'+domain));};
    const cfg=window.APP_CONFIG||{};const configured=cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('YOUR-');const sb=configured?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;const message=document.getElementById('message');if(new URLSearchParams(location.search).has('setup')){message.hidden=false;message.textContent='管理者による初期設定中です。Supabase接続後にアクセス申請を利用できます。';}
    function show(text,type=''){message.hidden=false;message.className='message '+type;message.textContent=text}
    const requestAccess=document.getElementById('requestAccess');let currentUser=null;
    async function loadUser(){if(!configured)return;const{data}=await sb.auth.getSession();currentUser=data.session?.user||null;if(!currentUser)return;if(isAutoApproved(currentUser.email)){show('会社アカウントとして自動承認されています。Googleログイン後、そのまま入場できます。','ok');return}const{data:request}=await sb.from('access_requests').select('status').eq('email',currentUser.email).maybeSingle();if(request?.status==='approved')show('このGoogleアカウントは承認済みです。もう一度Googleログインを行ってください。','ok');else if(request?.status==='pending')show('アクセス申請は送信済みです。管理者の承認をお待ちください。','');else requestAccess.hidden=false}
    document.getElementById('googleLogin').onclick=async()=>{if(!configured)return show('Supabaseの設定がまだ完了していません。管理者に連絡してください。','error');const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname.replace('access.html','index.html')}});if(error)show('Googleログインを開始できませんでした。管理者に連絡してください。','error')};
    requestAccess.onclick=async()=>{if(!currentUser)return show('先にGoogleログインを行ってください。','error');const name=currentUser.user_metadata?.full_name||currentUser.user_metadata?.name||currentUser.email;const{error}=await sb.from('access_requests').insert({full_name:name,email:currentUser.email.toLowerCase()});if(error)return show(error.code==='23505'?'このGoogleアカウントはすでに申請済みです。':'アクセス申請を送信できませんでした。','error');requestAccess.hidden=true;show('アクセス申請を送信しました。管理者の承認をお待ちください。','ok')};loadUser();
  </script>
</body>
</html>
