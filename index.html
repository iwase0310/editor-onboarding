<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新規エディター オンボーディング</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--bg:#f6f8fb;--card:#fff;--brand:#6457e8;--brand2:#8d7df5;--ok:#1d9b68;--warn:#a56b00;--shadow:0 16px 40px rgba(25,31,56,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
    a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}.app{min-height:100vh;display:grid;grid-template-columns:290px 1fr}
    aside{background:#1f2340;color:#eef0ff;padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;letter-spacing:.02em;font-size:18px;margin-bottom:7px}.sub{color:#b7b9d3;font-size:12px;margin-bottom:24px}.progress{background:#3b3e5d;border-radius:999px;height:8px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8b80ff,#c0a6ff);width:0;transition:.3s}.count{font-size:12px;color:#c7c9df}.nav{margin-top:26px;display:grid;gap:7px}.nav button{border:0;background:transparent;color:#caccea;text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px}.nav button:hover,.nav button.active{background:#34385a;color:#fff}.nav button.done{color:#93e5c0}.main{max-width:940px;width:100%;margin:auto;padding:42px 28px 80px}.hero{background:linear-gradient(135deg,#6357e6,#8d7df5);color:white;border-radius:24px;padding:34px 36px;box-shadow:var(--shadow);margin-bottom:24px}.eyebrow{font-size:12px;opacity:.8;letter-spacing:.08em}.hero h1{font-size:clamp(27px,4vw,42px);line-height:1.25;margin:8px 0 12px}.hero p{margin:0;max-width:650px;color:#f3f1ff}.hero-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:700}.btn.light{background:#fff;color:#4f45c8}.btn.ghost{background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.35)}.section{display:none}.section.active{display:block}.section-head{display:flex;gap:14px;align-items:flex-start;margin:22px 0 16px}.num{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#ebe9ff;color:#5549cd;font-weight:800;flex:none}.section h2{margin:0;font-size:25px;line-height:1.3}.lead{color:var(--muted);margin:4px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 5px 20px rgba(25,31,56,.04);margin:14px 0}.card h3{margin:0 0 10px;font-size:18px}.note{border-left:4px solid #f0b34a;background:#fff9eb;padding:12px 15px;border-radius:8px;color:#624b19}.danger{border-left-color:#e16c6c;background:#fff5f5;color:#702d2d}.checklist{display:grid;gap:10px}.check{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.check input{margin-top:5px;accent-color:var(--brand);width:17px;height:17px}.check.done{background:#f0fbf6;border-color:#b9ead3}.check.done span{text-decoration:line-through;color:#61806f}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.link-card{border:1px solid var(--line);border-radius:12px;padding:14px}.link-card small{display:block;color:var(--muted);margin-top:4px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:700}.code{background:#1f2340;color:#eef0ff;border-radius:12px;padding:16px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.step-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#edf0f6;color:var(--ink)}.finish{background:#edfaf4;border:1px solid #b9ead3}.footer-note{color:var(--muted);font-size:12px;margin-top:24px}.mobile-bar{display:none}
    :root{--ink:#18213a;--muted:#667085;--line:#e6e9ef;--bg:#f8f8f7;--card:#fff;--brand:#17365f;--brand2:#246aa3;--orange:#f16b22;--shadow:0 16px 40px rgba(24,33,58,.10)}
    body{background:var(--bg);position:relative;overflow-x:hidden}body::before{content:"";position:fixed;z-index:-1;inset:-20% -10% auto auto;width:58vw;height:150vh;transform:rotate(21deg);background:linear-gradient(128deg,transparent 0 32%,rgba(24,70,116,.10) 33% 43%,transparent 44% 48%,rgba(241,107,34,.12) 49% 61%,transparent 62%);pointer-events:none}
    aside{background:#172e4f;border-right:5px solid var(--orange)}.sub{color:#b7c8dc}.progress{background:#36506e}.progress i{background:linear-gradient(90deg,var(--orange),#ffb15c)}.count{color:#c7d6e7}.nav button{color:#c8d6e7}.nav button:hover,.nav button.active{background:#294a70}.nav button.done{color:#ffbf88}
    .hero{background:#fff;color:var(--ink);border-top:8px solid var(--brand);position:relative;overflow:hidden}.hero::after{content:"";position:absolute;right:-8%;top:-45%;width:64%;height:185%;transform:rotate(25deg);background:linear-gradient(125deg,transparent 0 26%,rgba(20,61,104,.92) 27% 43%,transparent 44% 49%,rgba(241,107,34,.90) 50% 69%,transparent 70%);opacity:.9}.hero>*{position:relative;z-index:1}.eyebrow{color:var(--orange);font-weight:800}.hero p{color:#4d5c70}.btn.light{background:var(--brand);color:#fff}.btn.ghost{background:#fff;color:var(--brand);border-color:#c9d6e3}.num{background:#e8f0f7;color:var(--brand);border-color:#c4d7e8}.note{border-left-color:var(--orange);background:#fff6ef;color:#70401f}.code{background:#172e4f}.btn.primary{background:var(--brand)}.check input{accent-color:var(--orange)}
    .secure{border-left:4px solid #2479ad!important;background:#eef7fc!important;color:#224d70!important}.visual-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.flow-item{position:relative;border-radius:14px;padding:15px;background:#eef4f9;border:1px solid #c9d9e7;text-align:center}.flow-item strong{display:block;color:var(--brand);font-size:15px}.flow-item:nth-child(2){background:#fff4ec;border-color:#f3c3a3}.flow-item:nth-child(2) strong{color:#c44f18}.flow-item:nth-child(3){background:#edf8f3;border-color:#bce4d0}.flow-item:nth-child(3) strong{color:#19825a}.tool-grid{display:grid;gap:10px}.tool-row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}.tool-row strong{color:var(--brand)}.tool-row code{font-size:12px;overflow-wrap:anywhere}
    @media(max-width:760px){.app{display:block}aside{position:static;height:auto;padding:20px}.nav{display:flex;overflow:auto;margin-top:18px}.nav button{white-space:nowrap}.main{padding:22px 16px 60px}.hero{padding:25px 22px;border-radius:18px}.hero::after{right:-28%;width:52%;opacity:.42}.card{padding:18px}.mobile-bar{display:block}.table{font-size:12px;display:block;overflow:auto}.visual-flow{grid-template-columns:1fr}.tool-row{grid-template-columns:1fr;gap:3px}}
    /* 前回の紫系デザインへ戻す */
    :root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--bg:#f6f8fb;--card:#fff;--brand:#6457e8;--brand2:#8d7df5;--ok:#1d9b68;--warn:#a56b00;--shadow:0 16px 40px rgba(25,31,56,.08)}
    body{background:var(--bg)}body::before{display:none}aside{background:#1f2340;border-right:0}.sub{color:#b7b9d3}.progress{background:#3b3e5d}.progress i{background:linear-gradient(90deg,#8b80ff,#c0a6ff)}.count{color:#c7c9df}.nav button{color:#caccea}.nav button:hover,.nav button.active{background:#34385a}.nav button.done{color:#93e5c0}.hero{background:linear-gradient(135deg,#6357e6,#8d7df5);color:#fff;border-top:0}.hero::after{display:none}.hero p{color:#f3f1ff}.eyebrow{color:inherit;font-weight:400}.btn.light{background:#fff;color:#4f45c8}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}.num{background:#ebe9ff;color:#5549cd;border-color:transparent}.note{border-left-color:#f0b34a;background:#fff9eb;color:#624b19}.code{background:#1f2340}.btn.primary{background:var(--brand)}.check input{accent-color:var(--brand)}
    </style>
  <script src="supabase-config.js"></script><script src="auth-guard.js"></script>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">EDITOR ONBOARDING</div>
      <div class="sub">新規エディター向け・順番に進めるガイド</div>
      <div class="count" id="progressText">0 / 7 セクション完了</div>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="hero">
        <div class="eyebrow">WELCOME TO THE TEAM</div>
        <h1>新規エディター<br>オンボーディング</h1>
        <p>準備から制作・納品まで、表示される順番に進めれば完了できます。迷ったら、早めに担当者へ相談しましょう。</p>
        <div class="hero-tools"><button class="btn light" id="startBtn">最初から始める</button><button class="btn ghost" id="resetBtn">進捗をリセット</button></div>
      </div>
      <div id="content"></div>
      <p class="footer-note">※公開URLにログインパスワードを掲載すると第三者に取得されるため、認証情報は管理者から安全な方法で受け取ってください。</p>
    </main>
  </div>
  <script>
    const sections=[
      {title:'まず確認すること',lead:'この資料の使い方と、最初に押さえる注意事項です。',body:`<div class="card"><h3>進め方</h3><p>左のメニューまたは「次のセクションへ」ボタンで進みます。各項目を確認しながら、上から順番に進めてください。</p><div class="note danger">共有されているシートや資料は、原則として編集せず、閲覧・参照のみ行ってください。</div></div>`},
      {title:'入社後の準備',lead:'所属部署、Chatwork、シフト、業務ツールを整えます。',body:`<div class="card"><h3>所属部署</h3><p>所属部署を確認します。不明な場合は入社準備チャットのグループ名を確認し、それでもわからなければ質問してください。</p></div><div class="card"><h3>Chatwork</h3><div class="links"><div class="link-card"><a href="https://www.chatwork.com/g/akgw66vhwb49ai" target="_blank">【アセクリ】全体共有 ↗</a><small>全員参加・周知と情報共有</small></div><div class="link-card"><a href="https://www.chatwork.com/g/eo0zkibbszvmom" target="_blank">勤怠報告部屋 ↗</a><small>遅刻・早退・残業・欠勤の報告</small></div></div><p class="note">制作グループは、所属部署に合うものを1つだけ選択してください。</p></div><div class="card"><h3>シフト・勤怠 <small>（業務委託・アルバイトのみ）</small></h3><ul><li>月末5営業日前頃にシフトを回収。</li><li>休みは事前に担当者・上長へ相談。</li><li>遅刻・早退・残業・欠勤などは担当者へ連絡し、勤怠報告部屋へ記録。</li><li>実際の勤務状況に合わせてシフト表も更新。</li></ul><a href="https://docs.google.com/spreadsheets/d/1hELTzYx7hvnkGfCNZmQy7gsx4W6mFKpi9TiEYAu2uZA/edit?gid=1491906935" target="_blank">シフト表を開く ↗</a></div><div class="card"><h3>業務ツール</h3><p>サイトURLは以下から開けます。ログインID・パスワードは、公開サイトには掲載せず、管理者から安全な方法で受け取ってください。</p><div class="tool-grid"><div class="tool-row"><strong>delmo</strong><span><a href="https://service.delm0.jp/bought#restore" target="_blank">サイトを開く ↗</a><br><small>ログインID・パス：管理者から個別受領</small></span></div><div class="tool-row"><strong>動画生成AI</strong><span><a href="https://pollo.ai/ja/app?target=image-to-video&projectId=cmcswiwz400c0xa73g8li3hys" target="_blank">Pollo AIを開く ↗</a><br><small>ログインID・パス：管理者から個別受領</small></span></div><div class="tool-row"><strong>画像生成AI</strong><span><a href="https://labs.google/fx/ja" target="_blank">ImageFX</a> ・ <a href="https://www.midjourney.com/imagine" target="_blank">Midjourney</a> ・ <a href="https://chatgpt.com/" target="_blank">ChatGPT</a> ・ <a href="https://aistudio.google.com/prompts/new_chat" target="_blank">Google AI Studio</a><br><small>共有Googleアカウント：管理者から個別受領</small></span></div></div><div class="note secure">パスワードをURLやHTMLへ埋め込むと、リンクを知っている人全員に漏えいします。安全な共有方法を使用してください。</div></div>`},
      {title:'動画制作の基本',lead:'動画の種類と、編集時に気をつけることを理解します。',body:`<div class="card"><h3>基本構成</h3><p><strong>冒頭または年齢展開 ＋ 本編</strong>が基本です。1分以内の縦型ショート広告動画を制作します。</p><table class="table"><tr><th>種類</th><th>役割・目安</th></tr><tr><td>本編</td><td>商品・サービスを伝えるメイン動画。長くても57秒程度。</td></tr><tr><td>冒頭</td><td>視聴者の興味を引き、本編へつなげる3〜5秒程度の動画。</td></tr><tr><td>年齢展開</td><td>売れた冒頭を年齢別に展開。1歳刻み、10歳刻みがあります。</td></tr></table></div><div class="card"><h3>編集時の注意</h3><ul><li>本編と冒頭の音声速度・音量を合わせる。</li><li>BGMあり・なしを確認し、BGMの尺を合わせる。</li><li>商材ごとの注釈ルールと、必要なモザイク素材を確認する。</li><li>TikTokなどのUIで隠れないよう、セーフティーゾーンを意識する。</li></ul></div>`},
      {title:'制作資料を読む',lead:'新人向け資料と編集資料を確認します。',body:`<div class="card"><h3>必ず読む資料</h3><div class="links"><div class="link-card"><a href="https://docs.google.com/spreadsheets/d/1NuOLNH5Dfwz5rFmsbt8tHVVvR1hgbzhcgkKiI_JWdSI/edit?gid=1378628680" target="_blank">新人向けプチ制作フロー ↗</a><small>制作の基本、冒頭、年齢展開、素材、参考リンク</small></div><div class="link-card"><a href="https://docs.google.com/presentation/d/17Opd9YF2W2haxUfyfgXJWPrZup378JqXCEIbrybsGwM/edit?slide=id.p" target="_blank">エディター向け編集資料 ↗</a><small>編集時の基本ルールと注意事項</small></div></div></div>`},
      {title:'制作環境を整える',lead:'素材・Adobe・リサーチ環境を準備します。',body:`<div class="card"><h3>共有素材</h3><p>フォント、音声素材、SE、BGM、参考資料は共有ドライブを確認してください。</p><a href="https://drive.google.com/drive/u/0/folders/0AMt2GTFcbQEMUk9PVA" target="_blank">アセクリナレッジ共有用ドライブ ↗</a><div class="note">閲覧できない場合は、管理部へ権限付与を依頼してください。</div></div><div class="card"><h3>Adobe</h3><p>自分が作業しやすいようにAdobeを設定します。導入や設定の不明点は管理部へ確認してください。</p></div><div class="card"><h3>待ち時間のリサーチ</h3><p>売れている広告の構成、冒頭、テロップ、素材、テンポを観察し、制作に活かします。</p></div>`},
      {title:'書き出し・納品',lead:'書き出しからプロジェクト整理、納品までを一つの流れで確認します。',body:`<div class="card"><h3>納品までの3ステップ</h3><div class="visual-flow"><div class="flow-item"><strong>01　整理</strong><span>ビン・シーケンスを整える</span></div><div class="flow-item"><strong>02　書き出し</strong><span>ビットレート5で出力</span></div><div class="flow-item"><strong>03　納品</strong><span>CRとプロマネを分ける</span></div></div></div><div class="card"><h3>プロジェクトマネージャー</h3><ul><li>動画・音声・エフェクトなどは、種類ごとにビンを分ける。</li><li>冒頭、年齢展開、本編に必要なシーケンスだけを整理する。</li><li>不要なシーケンスを残さず、引き継ぎやすい状態にする。</li></ul><p>命名例：</p><div class="code">SA_ニキビ女性_本編_260816_冒頭プロマネ\nSA_ニキビ女性_本編_260816_年齢プロマネ\nSA_ニキビ女性_本編_260816_本編プロマネ</div></div><div class="card"><h3>書き出し</h3><p>ターゲットビットレートを<strong>5</strong>に設定し、書き出しプリセットとして保存します。容量を抑え、アップロード時間を短縮します。</p></div><div class="card"><h3>納品時のファイル分け</h3><div class="code">本編名\n├─ 本編\n├─ 冒頭\n└─ 年齢展開</div><p>無料版・有料版など、内容が異なるデータは混在させません。CRとプロジェクトマネージャーも別フォルダに分けます。</p><div class="code">260816_冒頭\n├─ CR\n└─ プロジェクトマネージャー</div><p class="note">ファイル名や納品形式に指定がある場合は、依頼者・運用者へ確認してください。</p></div>`},
      {title:'完了報告',lead:'最後にチェックリストを確認して、完了報告を送信します。',body:`<div class="card"><h3>最終チェック</h3><div class="checklist" id="finalChecks">${['所属部署とChatworkを確認した','シフトを記入し、担当者へ報告した','業務ツールへログインできる','制作資料を確認した','動画の種類・編集ルールを理解した','共有素材・Adobe・リサーチ環境を確認した','プロマネ・書き出し・納品ルールを理解した','不明点を解消した'].map((x,i)=>`<label class="check"><input type="checkbox" data-final="${i}"><span>${x}</span></label>`).join('')}</div></div><div class="card finish"><h3>完了報告テンプレート</h3><div class="code">[toall]\n\nお疲れ様です。XXです。\n入社オンボーディングが完了いたしました。\nご担当者の方は、次の指示をいただけますと幸いです。\n何卒よろしくお願いいたします。</div><p>「XX」を自分の名前に変更して、入社準備チャットへ送信してください。</p></div>`}
    ];
    let current=Number(localStorage.getItem('onboarding-current')||0); let done=JSON.parse(localStorage.getItem('onboarding-done')||'[]');
    const nav=document.getElementById('nav'),content=document.getElementById('content');
    function render(){nav.innerHTML=sections.map((s,i)=>`<button class="${i===current?'active ':''}${done[i]?'done':''}" data-go="${i}">${done[i]?'✓ ':''}${i+1}. ${s.title}</button>`).join('');content.innerHTML=sections.map((s,i)=>`<section class="section ${i===current?'active':''}" id="section-${i}"><div class="section-head"><div class="num">${i+1}</div><div><h2>${s.title}</h2><p class="lead">${s.lead}</p></div></div>${s.body}<div class="step-actions">${i?`<button class="btn secondary" data-prev="${i}">← 前へ</button>`:'<span></span>'}${i<sections.length-1?`<button class="btn primary" data-next="${i}">完了して次へ →</button>`:'<button class="btn primary" id="finishBtn">オンボーディングを完了する</button>'}</div></section>`).join('');
      document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=+b.dataset.go;save();render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{done[current]=true;current=Math.min(current+1,sections.length-1);save();render()});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{current=Math.max(current-1,0);save();render()});document.querySelectorAll('input[data-final]').forEach(x=>{x.checked=!!done['f'+x.dataset.final];x.onchange=()=>{done['f'+x.dataset.final]=x.checked;save()};});document.getElementById('finishBtn')?.addEventListener('click',()=>{done[sections.length-1]=true;save();alert('オンボーディング完了です。入社準備チャットへ完了報告を送信してください。');});update();}
    function save(){localStorage.setItem('onboarding-current',current);localStorage.setItem('onboarding-done',JSON.stringify(done));update()};function update(){let total=sections.length;let n=done.filter((x,i)=>i<total&&x).length;document.getElementById('progressText').textContent=`${n} / ${total} セクション完了`;document.getElementById('progressBar').style.width=`${n/total*100}%`;}
    document.getElementById('startBtn').onclick=()=>{current=0;save();render()};document.getElementById('resetBtn').onclick=()=>{if(confirm('進捗をリセットしますか？')){current=0;done=[];save();render()}};render();
  </script>
</body>
</html>
